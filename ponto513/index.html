<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e0d7;--card:#f3ede5;--tx:#2a2521;--dk:#393536;--gold:#b8996d;--ti:#8c8379;--bd:#cfc4b6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.35;padding-top:env(safe-area-inset-top,0px)}
header{text-align:center;padding:24px 16px 10px}
header img{width:112px;height:112px;display:block;margin:0 auto 10px}
h1{margin:0;font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-weight:400;font-size:clamp(2.2rem,12vw,3.4rem);overflow-wrap:anywhere;line-height:.95;letter-spacing:.02em;color:var(--ti);text-transform:uppercase}
.sub{color:var(--gold);font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-top:8px}
nav{position:sticky;top:0;background:var(--bg);z-index:5;padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;gap:8px;overflow-x:auto}
nav button{flex:none;border:2px solid var(--dk);background:transparent;color:var(--dk);padding:7px 14px;border-radius:0;font:700 .78rem 'Montserrat',sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
nav button.on{background:var(--dk);color:#fff}
main{max-width:720px;margin:0 auto;padding:12px 16px 80px}
input{font:500 1rem 'Montserrat',sans-serif;color:var(--tx);background:var(--card);border:2px solid var(--dk);border-radius:0;padding:10px 12px;width:100%}
h2{background:var(--dk);color:#fff;text-align:center;font-weight:800;font-size:1rem;letter-spacing:.05em;text-transform:uppercase;margin:26px 0 12px;padding:9px 10px}
.item{display:flex;align-items:flex-end;gap:8px;padding:6px 0}
.nm{font-weight:800;font-size:.9rem;text-transform:uppercase}
.nm small{font-weight:700;font-size:.62rem;color:var(--gold);letter-spacing:.03em;margin-left:5px}
.ld{flex:1;border-bottom:1.5px solid var(--dk);min-width:14px;margin-bottom:5px}
.price{font-weight:800;font-size:.9rem;white-space:nowrap}
.tags{display:block;margin-top:2px}
.tag{display:inline-block;font-size:.62rem;font-weight:700;border:1.5px solid var(--gold);color:var(--gold);padding:0 5px;margin:2px 4px 0 0;text-transform:uppercase}
.off{opacity:.45}.off .nm{text-decoration:line-through}
.empty{text-align:center;color:var(--ti);padding:30px;font-weight:700}
footer{max-width:560px;margin:0 auto;text-align:center;color:var(--dk);font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.02em;padding:0 16px 34px}
</style>
</head>

<nav id="nav"></nav>
<main><input id="q" type="search" placeholder="Pesquisar no menu…"><div id="menu"><div class="empty">A carregar…</div></div></main>
<footer id="foot"></footer>

<script>
/* O conteúdo vem do ficheiro menu.csv (mesma pasta). Edite-o no Excel. */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let M = { nome: 'Menu', subtitulo: '', rodape: '', moeda: '€', categorias: [] }, cat = 'Todas';

function parseCSV(t) {
  t = t.replace(/^\uFEFF/, '');
  const d = t.includes(';') ? ';' : ',', rows = [];
  let r = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === d) { r.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; r.push(f); rows.push(r); r = []; f = ''; }
    else f += c;
  }
  if (f || r.length) { r.push(f); rows.push(r); }
  return rows;
}
function load(text) {
  const map = {}, order = [];
  parseCSV(text).forEach(r => {
    const a = (r[0] || '').trim();
    if (!a || r.every(x => !x.trim())) return;
    if (a[0] === '#') { const k = a.slice(1).toLowerCase(); if (k in M) M[k] = (r[1] || '').trim(); return; }
    if (a.toLowerCase() === 'categoria') return; // cabeçalho
    const n = (r[1] || '').trim(); if (!n) return;
    const p = parseFloat(String(r[3] || '').replace(/[^\d,.-]/g, '').replace(',', '.')) || 0;
    if (!map[a]) { map[a] = []; order.push(a); }
    map[a].push({ n, d: (r[2] || '').trim(), p, t: (r[4] || '').split(/[,|]/).map(s => s.trim()).filter(Boolean), off: /^(sim|s|1|x)$/i.test((r[5] || '').trim()) });
  });
  M.categorias = order.map(k => ({ nome: k, itens: map[k] }));
}
const fmt = p => p.toFixed(2).replace('.', ',') + ' ' + M.moeda;
function render() {
  $('nome').textContent = M.nome; $('sub').textContent = M.subtitulo; $('foot').textContent = M.rodape;
  document.title = 'Menu — ' + M.nome;
  const q = $('q').value.trim().toLowerCase();
  $('nav').innerHTML = ['Todas', ...M.categorias.map(c => c.nome)].map(n => `<button class="${n === cat ? 'on' : ''}" data-c="${esc(n)}">${esc(n)}</button>`).join('');
  let h = '';
  M.categorias.forEach(c => {
    if (cat !== 'Todas' && cat !== c.nome) return;
    const its = c.itens.filter(i => !q || (i.n + ' ' + i.d + ' ' + i.t.join(' ')).toLowerCase().includes(q));
    if (!its.length) return;
    h += `<h2>${esc(c.nome)}</h2>` + its.map(i => `<div class="item${i.off ? ' off' : ''}"><div><span class="nm">${esc(i.n)}${i.d ? `<small>${esc(i.d)}</small>` : ''}</span>${(i.t.length || i.off) ? `<span class="tags">${i.t.map(t => `<span class="tag">${esc(t)}</span>`).join('')}${i.off ? '<span class="tag">Esgotado</span>' : ''}</span>` : ''}</div><span class="ld"></span><span class="price">${fmt(i.p)}</span></div>`).join('');
  });
  $('menu').innerHTML = h || '<div class="empty">Nenhum resultado.</div>';
}
$('nav').onclick = e => { const b = e.target.closest('button'); if (b) { cat = b.dataset.c; render(); } };
$('q').oninput = render;
fetch('menu.csv?v=' + Date.now(), { cache: 'no-store' })
  .then(r => { if (!r.ok) throw 0; return r.text(); })
  .then(t => { load(t); render(); })
  .catch(() => { $('menu').innerHTML = '<div class="empty">Não foi possível carregar o menu (menu.csv). Abra esta página a partir do site, não diretamente do computador.</div>'; });
</script>
