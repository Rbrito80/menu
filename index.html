<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu</title>
<style>
:root{--bg:#f3f7f1;--card:#fff;--tx:#1d2a21;--mu:#5d6b61;--ac:#007a37;--bd:#dbe6d8;--hd:#00a651;--ye:#e2e600;--on:#fff}
@media (prefers-color-scheme:dark){:root{--on:#06210f;--bg:#0e1710;--card:#16231a;--tx:#eef4ec;--mu:#9fb0a3;--ac:#3ddc6e;--bd:#25382b;--hd:#0b6b34;--ye:#e2e600}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.4}
header{text-align:center;padding:calc(26px + env(safe-area-inset-top,0px)) 16px 20px;background:var(--hd);color:#fff;border-bottom:5px solid var(--ye)}
h1{margin:0;font-size:1.9rem;font-weight:800;letter-spacing:.01em}
.sub{color:#eaffd9;font-size:.95rem;margin-top:4px}
nav{position:sticky;top:0;background:var(--bg);z-index:5;padding:8px 12px;border-bottom:1px solid var(--bd);display:flex;gap:8px;overflow-x:auto;font-family:system-ui,sans-serif}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;font-size:.9rem;cursor:pointer}
nav button.on{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}
main{max-width:720px;margin:0 auto;padding:12px 16px 90px}
input{font-family:system-ui,sans-serif;font-size:1rem;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;width:100%}
h2{font-size:1.25rem;margin:26px 0 8px;color:var(--ac);border-left:5px solid var(--ye);padding-left:10px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0;display:flex;justify-content:space-between;gap:14px}
.item h3{margin:0;font-size:1.05rem}
.item p{margin:4px 0 0;color:var(--mu);font-size:.9rem;font-family:system-ui,sans-serif}
.price{font-weight:bold;white-space:nowrap;font-family:system-ui,sans-serif}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--bd);border-radius:6px;padding:1px 6px;margin:6px 4px 0 0;color:var(--mu);font-family:system-ui,sans-serif}
.empty{text-align:center;color:var(--mu);padding:30px;font-family:system-ui,sans-serif}
footer{text-align:center;color:var(--mu);font-size:.8rem;padding:0 16px 30px;font-family:system-ui,sans-serif}
</style>
</head>
<body>
<header><h1 id="nome">Menu</h1><div class="sub" id="sub"></div></header>
<nav id="nav"></nav>
<main><input id="q" type="search" placeholder="Pesquisar no menu…"><div id="menu"><div class="empty">A carregar…</div></div></main>
<footer id="foot"></footer>

<script>
/* O conteúdo vem do ficheiro menu.csv (mesma pasta). Edite-o no Excel. */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let M = { nome: 'Menu', subtitulo: '', rodape: '', moeda: '€', categorias: [] }, cat = 'Todas';

function parseCSV(t) {
  t = t.replace(/^\uFEFF/, '');
  const d = t.includes(';') ? ';' : ',', rows = [];
  let r = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === d) { r.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; r.push(f); rows.push(r); r = []; f = ''; }
    else f += c;
  }
  if (f || r.length) { r.push(f); rows.push(r); }
  return rows;
}
function load(text) {
  const map = {}, order = [];
  parseCSV(text).forEach(r => {
    const a = (r[0] || '').trim();
    if (!a || r.every(x => !x.trim())) return;
    if (a[0] === '#') { const k = a.slice(1).toLowerCase(); if (k in M) M[k] = (r[1] || '').trim(); return; }
    if (a.toLowerCase() === 'categoria') return; // cabeçalho
    const n = (r[1] || '').trim(); if (!n) return;
    const p = parseFloat(String(r[3] || '').replace(/[^\d,.-]/g, '').replace(',', '.')) || 0;
    if (!map[a]) { map[a] = []; order.push(a); }
    map[a].push({ n, d: (r[2] || '').trim(), p, t: (r[4] || '').split(/[,|]/).map(s => s.trim()).filter(Boolean), off: /^(sim|s|1|x)$/i.test((r[5] || '').trim()) });
  });
  M.categorias = order.map(k => ({ nome: k, itens: map[k] }));
}
const fmt = p => p.toFixed(2).replace('.', ',') + ' ' + M.moeda;
function render() {
  $('nome').textContent = M.nome; $('sub').textContent = M.subtitulo; $('foot').textContent = M.rodape;
  document.title = 'Menu — ' + M.nome;
  const q = $('q').value.trim().toLowerCase();
  $('nav').innerHTML = ['Todas', ...M.categorias.map(c => c.nome)].map(n => `<button class="${n === cat ? 'on' : ''}" data-c="${esc(n)}">${esc(n)}</button>`).join('');
  let h = '';
  M.categorias.forEach(c => {
    if (cat !== 'Todas' && cat !== c.nome) return;
    const its = c.itens.filter(i => !q || (i.n + ' ' + i.d + ' ' + i.t.join(' ')).toLowerCase().includes(q));
    if (!its.length) return;
    h += `<h2>${esc(c.nome)}</h2>` + its.map(i => `<div class="item" style="${i.off ? 'opacity:.5' : ''}"><div><h3>${esc(i.n)}</h3>${i.d ? `<p>${esc(i.d)}</p>` : ''}${i.t.map(t => `<span class="tag">${esc(t)}</span>`).join('')}${i.off ? '<span class="tag">Esgotado</span>' : ''}</div><div class="price">${fmt(i.p)}</div></div>`).join('');
  });
  $('menu').innerHTML = h || '<div class="empty">Nenhum resultado.</div>';
}
$('nav').onclick = e => { const b = e.target.closest('button'); if (b) { cat = b.dataset.c; render(); } };
$('q').oninput = render;
fetch('menu.csv?v=' + Date.now(), { cache: 'no-store' })
  .then(r => { if (!r.ok) throw 0; return r.text(); })
  .then(t => { load(t); render(); })
  .catch(() => { $('menu').innerHTML = '<div class="empty">Não foi possível carregar o menu (menu.csv). Abra esta página a partir do site, não diretamente do computador.</div>'; });
</script>
</body>
</html>
